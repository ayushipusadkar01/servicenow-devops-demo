name: servicenow-demo.yml

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: echo "Building application..."

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Run tests
        run: echo "Running application tests..."

  change:
    name: ServiceNow Change
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: ServiceNow DevOps Change Automation
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        id: create

        with:
          devops-integration-user-name: ${{ secrets.SN_DEVOPS_USER }}
          devops-integration-user-password: ${{ secrets.SN_DEVOPS_PASSWORD }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}

          context-github: ${{ toJSON(github) }}

          job-name: 'ServiceNow Change'

          change-request: '{"setCloseCode":"true","autoCloseChange":true,"attributes":{"short_description":"Automated deployment from GitHub","description":"Change automatically created from GitHub Actions using ServiceNow DevOps Change Velocity.","assignment_group":"a715cd759f2002002920bde8132e7018","implementation_plan":"Deploy application using GitHub Actions pipeline.","backout_plan":"Rollback to the previous successful application version if deployment fails.","test_plan":"Validate the application after deployment."}}'

          interval: '100'
          timeout: '3600'

          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Show ServiceNow Change Request
        run: |
          echo "Change Request Number: ${{ steps.create.outputs.change-request-number }}"
          echo "Change Request Sys ID: ${{ steps.create.outputs.change-request-sys-id }}"

  deploy:
    name: Deploy
    needs: change
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        run: echo "Application deployed successfully"
