name: servicenow-demo.yml

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: echo "Building application..."

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Run tests
        run: echo "Running application tests..."

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        run: echo "Application deployed successfully"
